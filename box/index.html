<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101310"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Box Trainer"><title>Box Trainer</title>
<style>
:root{color-scheme:dark;--bg:#101310;--panel:#1b201b;--line:#30382e;--ink:#f3f6ed;--muted:#9aa593;--accent:#d0fc73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.app{max-width:480px;margin:auto;padding:max(22px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-size:23px;font-weight:850;letter-spacing:-1px}.brand span{color:var(--accent)}.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin:5px 0 0}.icon{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);display:inline-grid;place-items:center}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.intro{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.intro h1{font-size:28px;letter-spacing:-1px;margin:0}.intro p{color:var(--muted);font-size:13px;margin:7px 0}.box{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}.box strong{color:var(--ink);display:block;font-size:14px}.timer{text-align:center;background:radial-gradient(ellipse at top,#2c3820 0, var(--panel) 70%);border:1px solid var(--line);border-radius:30px;padding:24px 14px 20px}.phase{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:2.5px;font-weight:800}.time{font-variant-numeric:tabular-nums;font-size:clamp(68px,23vw,108px);font-weight:800;letter-spacing:-6px;line-height:1.25;margin:12px 0 0}.status{font-size:13px;color:var(--muted);min-height:20px;margin:0 0 22px}.progress{height:5px;background:#343c30;border-radius:4px;overflow:hidden;margin:0 12px 20px}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s linear}.stats{display:grid;grid-template-columns:1fr 1fr}.stats>div+div{border-left:1px solid var(--line)}.stats small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;margin-bottom:5px}.stats strong{font-size:16px;font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;justify-content:center;gap:28px;margin:23px 0}.play{width:88px;height:88px;border:0;border-radius:50%;background:var(--accent);color:#17200c;box-shadow:0 5px 30px #b3ef4820;display:grid;place-items:center}.play svg{width:32px;height:32px;fill:currentColor;stroke-width:0}.control{text-align:center}.control span{display:block;font-size:10px;color:var(--muted);margin-top:7px}.section-label{font-size:11px;letter-spacing:1.8px;color:var(--muted);margin:26px 0 12px;text-transform:uppercase}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px 14px;min-width:0}.field label{font-size:11px;color:var(--muted);display:block;margin-bottom:7px}.field select,.field input{border:0;background:transparent;color:var(--ink);width:100%;min-height:32px;font-size:19px;font-weight:700}.field option{background:#1b201b}fieldset{margin:0;padding:0;border:0;min-width:0}fieldset:disabled{opacity:.5}.note{font-size:12px;line-height:1.6;color:var(--muted);margin:18px 0}.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;margin-top:20px;font-size:11px;color:var(--muted)}.toggle{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:10px 14px;min-height:44px}body.rest{--accent:#84d8f7}body.rest .timer{background:radial-gradient(ellipse at top,#203642,var(--panel) 70%)}body.done{--accent:#d0fc73}@media(max-width:350px){.app{padding-left:15px;padding-right:15px}.intro h1{font-size:24px}.controls{gap:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.screen-flash{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;background:#d0fc73}
.time.seconds{font-size:clamp(100px,34vw,152px);letter-spacing:-7px}
</style></head><body><div id="screenFlash" class="screen-flash" aria-hidden="true"></div><main class="app"><header><div><div class="brand">BOX <span>TRAINER</span></div></div><button class="icon" id="sound" aria-label="Desactivar sonido" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/></svg></button></header>

<section class="timer" aria-label="Temporizador"><div id="phase" class="phase" role="status">Entrenamiento</div><div class="time" id="time" role="timer" aria-live="off">60</div><p id="status" class="status" role="status">Listo para tu primera serie</p><div class="progress" role="progressbar" aria-label="Progreso del intervalo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div><div class="stats"><div><small>SERIE</small><strong id="series">01 / 08</strong></div><div><small>TIEMPO TOTAL</small><strong id="total">09:45</strong></div></div></section>
<div class="controls"><div class="control"><button id="reset" class="icon" aria-label="Reiniciar sesión"><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button><span>Reiniciar</span></div><button id="play" class="play" aria-label="Comenzar entrenamiento"></button><div class="control"><button id="next" class="icon" aria-label="Saltar al siguiente intervalo"><svg viewBox="0 0 24 24"><path d="m5 5 10 7-10 7zM19 5v14"/></svg></button><span>Siguiente</span></div></div>
<p class="section-label">Tu sesión</p><fieldset id="settings"><div class="settings"><div class="field"><label for="work">Entrenamiento</label><select id="work"></select></div><div class="field"><label for="rest">Descanso</label><select id="rest"></select></div><div class="field"><label for="rounds">Series</label><select id="rounds"></select></div><div class="field"><label for="prep">Preparación</label><select id="prep"><option value="0">Sin cuenta previa</option><option value="5" selected>5 segundos</option><option value="10">10 segundos</option></select></div></div></fieldset>
<div class="bottom"><span id="saved">Ajustes guardados en este dispositivo</span><button id="vibration" class="toggle" aria-pressed="true">Vibración · Sí</button></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id), fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const key='box-trainer-v1';let cfg={work:60,rest:15,rounds:8,prep:5,sound:true,vibration:true};let s={phase:'work',round:1,left:60,started:false},running=false,end=0,audio=null,lock=null,lastSecond=-1;
function options(id,values){$(id).innerHTML=values.map(v=>`<option value="${v}">${id==='rounds'?v+' series':fmt(v)}</option>`).join('')}
options('work',[10,15,20,30,40,45,60,75,90,120,150,180,240,300,600]);options('rest',[5,10,15,20,30,45,60,90,120,180]);options('rounds',Array.from({length:30},(_,i)=>i+1));
try{const old=JSON.parse(localStorage.getItem(key));if(old){for(const k of ['work','rest','rounds','prep'])if([...$(k).options].some(o=>+o.value===old.cfg?.[k]))cfg[k]=old.cfg[k];for(const k of ['sound','vibration'])if(typeof old.cfg?.[k]==='boolean')cfg[k]=old.cfg[k];const t=old.state;if(t&&['work','rest','prep','done'].includes(t.phase)&&Number.isInteger(t.round)&&t.round>=1&&t.round<=cfg.rounds&&Number.isFinite(t.left)&&t.left>=0&&t.left<=600)s=t;}}catch{}
for(const k of ['work','rest','rounds','prep'])$(k).value=cfg[k];if(!s.started)s.left=cfg.work;
function save(){try{localStorage.setItem(key,JSON.stringify({cfg,state:s}))}catch{$('saved').textContent='Sauvegarda no disponible'.replace('Sauvegarda','Guardado')}}
function duration(){return s.phase==='prep'?cfg.prep:s.phase==='rest'?cfg.rest:cfg.work}
function total(){if(s.phase==='done')return 0;if(!s.started)return cfg.rounds*cfg.work+(cfg.rounds-1)*cfg.rest+cfg.prep;const after=cfg.rounds-s.round;return s.left+(s.phase==='prep'?cfg.rounds*cfg.work+(cfg.rounds-1)*cfg.rest:s.phase==='work'?after*(cfg.work+cfg.rest):after*cfg.work+Math.max(0,after-1)*cfg.rest)}
function render(){document.body.className=s.phase==='rest'?'rest':s.phase==='done'?'done':'';$('phase').textContent=({work:'Entrenamiento',rest:'Descanso',prep:'Preparate',done:'Sesión completada'})[s.phase];$('time').textContent=duration()<=60?String(Math.max(0,Math.ceil(s.left))):fmt(s.left);$('time').classList.toggle('seconds',duration()<=60);$('series').textContent=String(s.round).padStart(2,'0')+' / '+String(cfg.rounds).padStart(2,'0');$('total').textContent=fmt(total());$('status').textContent=s.phase==='done'?'Buen trabajo. Sesión terminada.':running?(s.phase==='rest'?'Respirá. Recuperá. Volvé.':s.phase==='prep'?'Tomá posición junto al cajón':'Enfocate en cada repetición'):s.started?'En pausa · retomá cuando quieras':'Listo para tu primera serie';$('play').innerHTML=running?'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="m8 3 15 9-15 9z"/></svg>';$('play').setAttribute('aria-label',running?'Pausar entrenamiento':s.phase==='done'?'Volver a entrenar':'Reproducir entrenamiento');$('settings').disabled=running||s.started&&s.phase!=='done';$('next').disabled=s.phase==='done';const progress=s.phase==='done'?100:Math.max(0,Math.min(100,(1-s.left/duration())*100));$('bar').style.width=progress+'%';$('bar').parentElement.setAttribute('aria-valuenow',Math.round(progress));$('sound').setAttribute('aria-pressed',cfg.sound);$('sound').setAttribute('aria-label',cfg.sound?'Desactivar sonido':'Activar sonido');$('sound').style.opacity=cfg.sound?1:.45;$('vibration').textContent='Vibración · '+(cfg.vibration?'Sí':'No');$('vibration').setAttribute('aria-pressed',cfg.vibration)}
function tone(frequency,duration,volume,delay=0){
if(!cfg.sound||audio?.state!=='running')return;
const now=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
o.type='square';o.frequency.setValueAtTime(frequency,now);o.connect(g);g.connect(audio.destination);
g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(volume*.9,.001),now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+duration);
o.start(now);o.stop(now+duration+.03);
}
function beep(final=false){
if(final){tone(880,.14,.32);tone(1318,.22,.38,.18)}else{tone(1046,.12,.22)}
if(cfg.vibration&&navigator.vibrate)navigator.vibrate(final?[120,70,170]:80);
}
async function wake(){try{if(running&&!lock&&navigator.wakeLock&&document.visibilityState==='visible'){const l=await navigator.wakeLock.request('screen');if(!running){await l.release();return}lock=l;l.addEventListener('release',()=>{if(lock===l)lock=null})}}catch{}}
function release(){const l=lock;lock=null;if(l)l.release().catch(()=>{})}
function advance(){if(s.phase==='prep')s.phase='work';else if(s.phase==='work'){if(s.round===cfg.rounds){s.phase='done';s.left=0;running=false;release();return}s.phase='rest'}else{s.phase='work';s.round++}s.left=duration();lastSecond=-1}
let flashAnimation=null;
function flash(final=false,phase=s.phase){
if(document.visibilityState!=='visible')return;
const overlay=$('screenFlash');
if(typeof overlay.animate!=='function')return;
flashAnimation?.cancel();
overlay.style.background=phase==='rest'?'#84d8f7':'#d0fc73';
const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
flashAnimation=overlay.animate([{opacity:0},{opacity:reduced?.10:final?.32:.16,offset:.2},{opacity:0}],{duration:reduced?1000:final?850:650,easing:'ease-out'});
}
function tick(){if(!running)return;let changed=false,finishedInterval=false,finishedPhase=s.phase;while(running&&Date.now()>=end){if(s.phase!=='prep'){finishedInterval=true;finishedPhase=s.phase}advance();changed=true;if(running)end+=s.left*1000}if(running){s.left=Math.max(0,(end-Date.now())/1000);const sec=Math.ceil(s.left);if(sec!==lastSecond){if(!changed){if(sec<=3&&sec>0||s.phase==='work'&&sec===30&&cfg.work>30)beep();if(s.phase!=='prep'&&sec===30&&duration()>30&&lastSecond>30)flash(false)}lastSecond=sec}}if(changed)beep(true);if(finishedInterval)flash(true,finishedPhase);render();save()}

function reset(){running=false;release();s={phase:'work',round:1,left:cfg.work,started:false};lastSecond=-1;render();save()}
$('play').onclick=()=>{if(running){tick();running=false;release();render();save();return}if(s.phase==='done')reset();try{audio ||= new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch{}if(!s.started){s.started=true;if(cfg.prep){s.phase='prep';s.left=cfg.prep}}running=true;end=Date.now()+s.left*1000;lastSecond=-1;wake();render();save()};
$('reset').onclick=()=>{if(s.started&&s.phase!=='done'&&!confirm('¿Reiniciar esta sesión desde la primera serie?'))return;reset()};$('next').onclick=()=>{if(s.phase==='done')return;s.started=true;advance();end=Date.now()+s.left*1000;beep(true);render();save()};for(const k of ['work','rest','rounds','prep'])$(k).onchange=()=>{cfg[k]=+$(k).value;reset()};$('sound').onclick=()=>{cfg.sound=!cfg.sound;render();save()};$('vibration').onclick=()=>{cfg.vibration=!cfg.vibration;render();save()};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();wake()}});window.addEventListener('pagehide',()=>{if(running){tick();running=false;save()}release()});setInterval(tick,100);render();
</script></body></html>
